<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>碩碩的車車城</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="車車城">
<meta name="theme-color" content="#7FD1FF">
<style>
:root{
  --sky-top:#7FD1FF; --sky-bottom:#E2F6FF; --grass:#8BD56E; --road:#4B5163; --line:#FFE45E; --curb:#CDD2DB;
  --panel-bg:#FFFFFF; --panel-ink:#24304A; --panel-soft:#EEF4FB; --panel-on:#3A86FF; --panel-on-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel-bg:#1E2433; --panel-ink:#EEF2FA; --panel-soft:#2B3346; }
}
:root[data-theme="dark"]{ --panel-bg:#1E2433; --panel-ink:#EEF2FA; --panel-soft:#2B3346; }
html{ height:100%; background:linear-gradient(var(--sky-top) 50%, var(--curb) 50%); scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; overflow:hidden; background:var(--sky-top); touch-action:none; overscroll-behavior:none;
  font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif; color:var(--panel-ink); }
*{ -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; box-sizing:border-box; }

#stage{ position:relative; width:100%; height:100%; overflow:hidden; background:linear-gradient(var(--sky-top), var(--sky-bottom) 55%); }
.sun{ position:absolute; top:7%; right:7%; width:min(17vh,17vw); aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 40% 40%, #FFF3A3, #FFD43B 60%); box-shadow:0 0 0 min(2.4vh,2.4vw) rgba(255,224,102,.35), 0 0 0 min(5vh,5vw) rgba(255,224,102,.15);
  animation:glow 3s ease-in-out infinite alternate; }
.sun i{ position:absolute; width:12%; height:12%; border-radius:50%; background:#5A3E1B; top:42%; }
.sun i:nth-child(1){ left:30%; } .sun i:nth-child(2){ right:30%; }
.sun b{ position:absolute; left:32%; right:32%; top:58%; height:14%; border:0.5vmin solid #5A3E1B; border-top:none; border-radius:0 0 999px 999px; }
@keyframes glow{ to{ transform:scale(1.05); } }
.cloud{ position:absolute; height:7vh; width:16vh; background:#fff; border-radius:999px; opacity:.95; animation:drift linear infinite; }
.cloud::before,.cloud::after{ content:""; position:absolute; background:#fff; border-radius:50%; }
.cloud::before{ width:8vh; height:8vh; left:2.5vh; top:-4vh; }
.cloud::after{ width:6vh; height:6vh; left:8vh; top:-2.6vh; }
.c1{ top:12%; left:-20vh; animation-duration:70s; }
.c2{ top:24%; left:-20vh; animation-duration:95s; animation-delay:-45s; transform:scale(.75); }
@keyframes drift{ from{ left:-22vh; } to{ left:110%; } }
#city{ position:absolute; left:0; right:0; bottom:48%; height:20%; width:100%; }
.grass{ position:absolute; left:0; right:0; top:52%; height:8%; background:var(--grass); }
.road{ position:absolute; left:0; right:0; top:60%; height:32%; background:var(--road); }
.road::before{ content:""; position:absolute; left:0; right:0; top:0; height:5px; background:#3D4252; }
.road::after{ content:""; position:absolute; left:0; right:0; top:calc(50% - 3px); height:6px;
  background:repeating-linear-gradient(90deg, var(--line) 0 44px, transparent 44px 88px); }
.curb{ position:absolute; left:0; right:0; top:92%; bottom:0;
  background:repeating-linear-gradient(90deg, var(--curb) 0 58px, #BFC5D0 58px 61px); }

#cars,#fx{ position:absolute; inset:0; pointer-events:none; }
#fx{ z-index:50; }
.veh{ position:absolute; left:0; top:0; will-change:transform; }
.flip,.bob{ width:100%; height:100%; }
.bob{ transform-origin:50% 100%; }
.veh svg{ width:100%; height:100%; display:block; overflow:visible; }
.wheel{ transform-box:fill-box; transform-origin:center; }
.driving .wheel{ animation:spin .45s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.driving .bob{ animation:bob .32s ease-in-out infinite alternate; }
@keyframes bob{ to{ transform:translateY(-2.5%); } }
.bob.pop{ animation:pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop{ 0%{ transform:scale(.1); } 100%{ transform:scale(1); } }
.bob.hop{ animation:hop .42s ease-out; }
@keyframes hop{ 0%{ transform:translateY(0) scale(1,1); } 25%{ transform:translateY(0) scale(1.08,.88); }
  60%{ transform:translateY(-24%) scale(.95,1.06); } 100%{ transform:translateY(0) scale(1,1); } }
.bob.wiggle{ animation:wig .6s ease-in-out; }
@keyframes wig{ 25%{ transform:rotate(-4deg); } 75%{ transform:rotate(4deg); } }
.arm{ transform-box:view-box; transform-origin:117px 60px; animation:dig 1.4s ease-in-out infinite alternate; }
@keyframes dig{ from{ transform:rotate(-10deg); } to{ transform:rotate(8deg); } }
.drum{ transform-box:view-box; transform-origin:84px 62px; animation:spin 2.2s linear infinite; }
.smoke{ transform-box:fill-box; transform-origin:center; animation:puffup 1.3s ease-out infinite; opacity:0; }
.smoke.s2{ animation-delay:.45s; } .smoke.s3{ animation-delay:.9s; }
@keyframes puffup{ 0%{ transform:translateY(0) scale(.5); opacity:.9; } 100%{ transform:translateY(-34px) scale(1.5); opacity:0; } }
.fa{ animation:fl .5s steps(1) infinite; } .fb{ animation:fl .5s steps(1) infinite .25s; }
@keyframes fl{ 50%{ opacity:.25; } }

.dot{ position:absolute; width:16px; height:16px; margin:-8px; border-radius:50%; animation:dot .7s ease-out forwards; }
@keyframes dot{ to{ transform:translate(var(--dx),var(--dy)) scale(.3); opacity:0; } }
.note{ position:absolute; width:46px; height:58px; margin-left:-23px; animation:rise 1.2s ease-out forwards; }
@keyframes rise{ 0%{ transform:translateY(0) scale(.5); opacity:0; } 15%{ opacity:1; transform:translateY(-10px) scale(1.15); }
  100%{ transform:translateY(-150px) rotate(var(--r)) scale(1); opacity:0; } }
.conf{ position:absolute; top:-24px; width:13px; height:19px; border-radius:3px; animation:fall var(--t) linear forwards; }
@keyframes fall{ to{ transform:translate(var(--dx),115vh) rotate(760deg); } }

#progress{ position:absolute; z-index:40; top:max(12px, 2vh); left:50%; transform:translateX(-50%); width:min(56%,420px); height:18px;
  border-radius:999px; background:rgba(255,255,255,.75); overflow:hidden; display:none; }
#progress div{ height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#FF8FAB,#FFC43D,#06D6A0,#3A86FF); transition:width .2s; }
body.music #progress{ display:block; }

#gear{ position:absolute; z-index:60; top:max(10px,1.6vh); left:max(10px,1.6vh); width:48px; height:48px; border-radius:50%;
  border:none; padding:0; background:conic-gradient(#3A86FF var(--p,0%), rgba(255,255,255,.55) 0); display:grid; place-items:center; }
#gear span{ width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.85); display:grid; place-items:center; }
#gear svg{ width:24px; height:24px; }

#start{ position:absolute; inset:0; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vh;
  background:rgba(127,209,255,.55); }
#start h1{ margin:0; font-weight:900; font-size:clamp(28px,6vmin,56px); color:#fff; letter-spacing:.06em;
  text-shadow:0 3px 0 #3A86FF, 0 6px 0 rgba(0,0,0,.12); }
#start .wheelbtn{ width:min(34vmin,240px); aspect-ratio:1; animation:pulse 1.2s ease-in-out infinite alternate; }
@keyframes pulse{ to{ transform:scale(1.08) rotate(8deg); } }
#start p{ margin:0; font-size:14px; font-weight:500; color:#24304A; background:rgba(255,255,255,.8); padding:6px 14px; border-radius:999px; }

#panel{ position:absolute; inset:0; z-index:90; display:none; align-items:center; justify-content:center; background:rgba(20,30,50,.45); padding:16px; }
#panel.open{ display:flex; }
.card{ background:var(--panel-bg); color:var(--panel-ink); border-radius:24px; padding:22px; width:min(440px,100%); max-height:100%; overflow:auto;
  touch-action:pan-y; box-shadow:0 20px 50px rgba(0,0,0,.25); }
.card h2{ margin:0 0 14px; font-size:20px; font-weight:900; }
.group{ margin-bottom:16px; }
.group h3{ margin:0 0 8px; font-size:14px; font-weight:700; opacity:.7; }
.seg,.songs{ display:flex; flex-wrap:wrap; gap:8px; }
.card button{ font:inherit; font-weight:700; font-size:16px; border:none; border-radius:14px; padding:11px 16px; background:var(--panel-soft); color:var(--panel-ink); }
.card button.on{ background:var(--panel-on); color:var(--panel-on-ink); }
.card .close{ width:100%; margin-top:4px; background:#06D6A0; color:#fff; font-size:18px; padding:14px; }
@media (orientation: portrait){
  #city{ bottom:58%; height:15%; }
  .grass{ top:42%; height:6%; }
  .road{ top:48%; height:42%; }
  .curb{ top:90%; }
}
#mission{ position:absolute; inset:0; pointer-events:none; z-index:30; }
#msvg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:45; overflow:visible; }
#msvg path{ fill:none; stroke:#4CC9F0; stroke-width:12; stroke-linecap:round; stroke-dasharray:16 10; animation:flow .3s linear infinite; opacity:.9; }
@keyframes flow{ to{ stroke-dashoffset:-26; } }
.house{ position:absolute; }
.house svg{ width:100%; height:100%; display:block; }
.flame{ position:absolute; transform:translate(-50%,-75%); transition:transform .15s, opacity .3s; }
.flame svg{ width:100%; height:100%; animation:flick .35s ease-in-out infinite alternate; transform-origin:50% 100%; }
@keyframes flick{ to{ transform:scale(1.08,.92) skewX(4deg); } }
.mud{ position:absolute; transform:translate(-50%,-50%); background:#8B5E3C; border-radius:58% 42% 55% 45%/48% 60% 40% 52%; transition:opacity .3s; }
.mud::before,.mud::after{ content:""; position:absolute; background:#8B5E3C; border-radius:50%; }
.mud::before{ width:34%; height:34%; right:-12%; top:10%; }
.mud::after{ width:26%; height:26%; left:-8%; bottom:4%; }
.bubble{ position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,.95); background:radial-gradient(circle at 30% 30%, #fff 0 18%, rgba(190,235,255,.55) 20%); animation:bub 1s ease-out forwards; }
@keyframes bub{ 0%{ transform:translate(-50%,-50%) scale(.3); } 80%{ opacity:1; } 100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% - 90px)) scale(1.1); opacity:0; } }
.hint{ position:absolute; width:90px; height:90px; margin:-45px; border-radius:50%; border:6px solid #fff; animation:hint 1s ease-out infinite; pointer-events:none; }
@keyframes hint{ from{ transform:scale(.4); opacity:1; } to{ transform:scale(1.3); opacity:0; } }
#sndwarn{ position:absolute; z-index:70; top:max(10px,1.6vh); right:max(10px,1.6vh); display:none; font:inherit; font-weight:700; font-size:15px; border:none; border-radius:999px; padding:10px 14px; background:#FF5D73; color:#fff; }
.card .test{ background:#FFC43D; color:#24304A; }
#scene{ position:absolute; inset:0; pointer-events:none; }
.gbi{ position:absolute; }
.gbi svg{ width:100%; height:100%; display:block; overflow:visible; }
.gbi.in{ animation:itemIn .45s cubic-bezier(.3,1.6,.5,1) backwards; }
@keyframes itemIn{ from{ transform:scale(0); } }
.gbi.wig{ animation:wig2 .5s ease-in-out; }
@keyframes wig2{ 25%{ transform:rotate(-12deg); } 75%{ transform:rotate(12deg); } }
.gbi.wave{ animation:wave .45s ease-in-out infinite alternate; transform-origin:50% 100%; }
@keyframes wave{ from{ transform:rotate(-4deg); } to{ transform:rotate(4deg); } }
.warm{ transform-box:view-box; }
.gbi.wave .warm{ animation:armwave .35s ease-in-out infinite alternate; }
@keyframes armwave{ from{ transform:rotate(-40deg); } to{ transform:rotate(-115deg); } }
.lid{ transform-box:fill-box; transform-origin:0% 100%; }
.lid.open{ animation:lid .45s ease-out; }
@keyframes lid{ 40%{ transform:translateY(-4px) rotate(-28deg); } }
#stage.dusk{ --sky-top:#FF9E7A; --sky-bottom:#FFE0B5; }
#stage.night{ --sky-top:#18264A; --sky-bottom:#3A4C7C; }
#stage.dusk .sun{ background:radial-gradient(circle at 40% 40%, #FFD1A1, #FF8C42 60%); }
#stage.night .sun{ background:radial-gradient(circle at 40% 40%, #FFFBE6, #F1E3A0 60%); box-shadow:0 0 0 2vmin rgba(241,227,160,.18); }
#stage.night .cloud{ opacity:.25; }
#stage.night .grass, #stage.night .road, #stage.night .curb, #stage.night #city{ filter:brightness(.62); }
#stage.night .win{ fill:#FFE066; }
#tint{ position:absolute; inset:0; z-index:48; pointer-events:none; background:rgba(0,0,0,0); transition:background 3s; }
#tint.warn{ background:rgba(255,120,60,.22); }
#tint.dark{ background:rgba(12,20,55,.55); }
.garage{ position:absolute; }
.garage svg{ width:100%; height:100%; display:block; }
.shutter{ transform-box:fill-box; transform-origin:50% 0; transform:scaleY(0); transition:transform 1.2s ease-in; }
.shutter.down{ transform:scaleY(1); }
#night{ position:absolute; inset:0; z-index:55; display:none; flex-direction:column; align-items:center; justify-content:center; gap:3vh;
  background:linear-gradient(#0E1733,#24345E); color:#E8ECF8; text-align:center; }
#night.show{ display:flex; animation:nightin 1.5s ease-out; }
@keyframes nightin{ from{ opacity:0; } }
#night svg{ width:min(40vmin,240px); height:auto; }
#night p{ margin:0; font-size:clamp(22px,5vmin,34px); font-weight:900; letter-spacing:.08em; }
#night small{ position:absolute; bottom:max(16px,3vh); font-size:12px; opacity:.45; }
#night i{ position:absolute; width:5px; height:5px; border-radius:50%; background:#FFF6C8; opacity:.8; }
.timeinfo{ margin:10px 0 0; font-size:14px; opacity:.7; }
.card .again{ margin-top:10px; background:#3A86FF; color:#fff; }
.hintbox{ position:absolute; width:0; height:0; pointer-events:none; z-index:46; }
.hintbox .hint{ left:0; top:0; }
.hand{ position:absolute; left:-30px; top:-3px; width:60px; height:70px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
.hand.tap{ animation:handtap .9s ease-in-out infinite; }
@keyframes handtap{ 0%,100%{ transform:translate(10px,18px); } 50%{ transform:translate(0,0) scale(.9); } }
.hand.rub{ animation:handrub .7s ease-in-out infinite alternate; }
@keyframes handrub{ from{ transform:translateX(-30px); } to{ transform:translateX(30px); } }
#stars{ position:absolute; z-index:40; top:max(12px,2vh); left:50%; transform:translateX(-50%); display:none; align-items:center; gap:6px;
  background:rgba(255,255,255,.85); border-radius:999px; padding:4px 14px 4px 8px; font-weight:900; font-size:20px; color:#24304A; }
#stars svg{ width:26px; height:26px; }
body.missionmode #stars{ display:flex; }
#stars.pop{ animation:starpop .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes starpop{ 0%{ transform:translateX(-50%) scale(1); } 40%{ transform:translateX(-50%) scale(1.5); } 100%{ transform:translateX(-50%) scale(1); } }
@media (prefers-reduced-motion: reduce){ .cloud,.sun,#start .wheelbtn{ animation:none; } }
</style>
</head>
<body>
<div id="stage">
  <div class="sun"><i></i><i></i><b></b></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <svg id="city" viewBox="0 0 1000 200" preserveAspectRatio="xMidYMax slice"></svg>
  <div class="grass"></div>
  <div class="road"></div>
  <div class="curb"></div>
  <div id="scene"></div>
  <div id="cars"></div>
  <div id="mission"></div>
  <svg id="msvg"><path id="stream" d=""/></svg>
  <div id="fx"></div>
  <button id="sndwarn">🔇 沒聲音？點我</button>
  <div id="progress"><div></div></div>
  <div id="stars"><svg viewBox="0 0 60 60"><polygon points="30,3 37,22 57,22 41,34 47,54 30,42 13,54 19,34 3,22 23,22" fill="#FFC43D" stroke="#F29E00" stroke-width="3" stroke-linejoin="round"/></svg><b>0</b></div>
  <div id="tint"></div>
  <div id="night">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="#F6E7A1"/><circle cx="82" cy="40" r="7" fill="#EAD58A"/><circle cx="40" cy="84" r="5" fill="#EAD58A"/>
      <path d="M38 58 Q45 64 52 58 M68 58 Q75 64 82 58" stroke="#8A6D2B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M52 76 Q60 82 68 76" stroke="#8A6D2B" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="36" cy="70" r="5" fill="#F5B8A8" opacity=".7"/><circle cx="84" cy="70" r="5" fill="#F5B8A8" opacity=".7"/></svg>
    <p>晚安，明天再玩</p>
    <small>家長：長按左上角齒輪可以重新開始</small>
  </div>
  <button id="gear" aria-label="長按開啟家長設定"><span><svg viewBox="0 0 24 24"><path fill="#24304A" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L14.9 3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.7h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12.9 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></span></button>

  <div id="start">
    <h1>碩碩的車車城</h1>
    <svg class="wheelbtn" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="none" stroke="#FF5D73" stroke-width="12"/>
      <circle cx="50" cy="50" r="13" fill="#FFC43D"/>
      <rect x="47" y="56" width="6" height="32" rx="3" fill="#FF5D73"/>
      <rect x="10" y="44" width="30" height="7" rx="3" fill="#FF5D73"/>
      <rect x="60" y="44" width="30" height="7" rx="3" fill="#FF5D73"/>
    </svg>
    <p>點一下開始・長按左上角齒輪可換玩法和歌</p>
  </div>

  <div id="panel">
    <div class="card">
      <h2>家長設定</h2>
      <div class="group"><h3>玩法</h3>
        <div class="seg" data-key="mode"><button data-v="tap">拍拍樂</button><button data-v="music">音樂隊</button><button data-v="mission">出任務</button><button data-v="trash">倒垃圾</button></div></div>
      <div class="group"><h3>音樂隊的歌</h3><div class="songs"></div></div>
      <div class="group"><h3>倒垃圾：地上的垃圾</h3>
        <div class="seg" data-key="trashN"><button data-v="3">3 個</button><button data-v="4">4 個</button><button data-v="8">8 個</button><button data-v="12">12 個</button><button data-v="20">20 個</button></div></div>
      <div class="group"><h3>倒垃圾：垃圾袋</h3>
        <div class="seg" data-key="bagN"><button data-v="3">3 袋</button><button data-v="6">6 袋</button><button data-v="10">10 袋</button><button data-v="20">20 袋</button></div></div>
      <div class="group"><h3>音量</h3>
        <div class="seg" data-key="vol"><button data-v="0">靜音</button><button data-v="0.35">小聲</button><button data-v="0.6">中</button><button data-v="0.9">大聲</button><button class="test">播一聲測試</button></div></div>
      <div class="group"><h3>遊戲時間</h3>
        <div class="seg" data-key="limit"><button data-v="5">5 分</button><button data-v="10">10 分</button><button data-v="15">15 分</button><button data-v="20">20 分</button><button data-v="0">不限</button></div>
        <p class="timeinfo"></p><button class="again">重新開始計時</button></div>
      <button class="close">回去玩</button>
    </div>
  </div>
</div>

<script>
(() => {
/* ---------- 角色（原創） ---------- */
const penguin=(x,y,r)=>`<g><circle cx="${x}" cy="${y}" r="${r}" fill="#22283A"/><ellipse cx="${x}" cy="${y+r*.18}" rx="${r*.72}" ry="${r*.66}" fill="#fff"/>
<circle cx="${x-r*.3}" cy="${y-r*.05}" r="${r*.13}" fill="#22283A"/><circle cx="${x+r*.3}" cy="${y-r*.05}" r="${r*.13}" fill="#22283A"/>
<path d="M${x-r*.18} ${y+r*.16} L${x+r*.18} ${y+r*.16} L${x} ${y+r*.42}Z" fill="#FF9F1C"/>
<circle cx="${x-r*.5}" cy="${y+r*.32}" r="${r*.12}" fill="#FFB3C1"/><circle cx="${x+r*.5}" cy="${y+r*.32}" r="${r*.12}" fill="#FFB3C1"/></g>`;
const lion=(x,y,r)=>`<g><circle cx="${x}" cy="${y}" r="${r}" fill="#E07A1F"/>
<circle cx="${x-r*.48}" cy="${y-r*.5}" r="${r*.22}" fill="#FFD166"/><circle cx="${x+r*.48}" cy="${y-r*.5}" r="${r*.22}" fill="#FFD166"/>
<circle cx="${x}" cy="${y+r*.05}" r="${r*.68}" fill="#FFD166"/>

  out.connect(master); o.start(t); o.stop(t+dur+.05); return o;

function trashTap(px,py){

    let best=null, bd=1e9; left.forEach(i=>{ const d=Math.hypot(i.x-px,i.y-py); if(d<bd){bd=d;best=i;} });
    if(bd<best.r) throwItem(best); else { burst(px,py); restartCls(best.el,'wig'); }
  } else if(gb.phase==='arrive'){ burst(px,py); floatNote(px,py+30,PALETTE[Math.floor(Math.random()*6)]); }

  else if(gb.phase==='dump'){
    const left=gb.bags.filter(b=>!b.thrown); if(!left.length){ burst(px,py); return; }
    let best=left[0], bd=1e9; left.forEach(b=>{ const d=Math.hypot(b.x-px,b.y-py); if(d<bd){bd=d;best=b;} });
    throwBag(best);

  timeState='winding'; busy=true; noteIdx=0;
  clearVehicles(); layer.innerHTML=''; mLayer.innerHTML=''; sceneLayer.innerHTML=''; fx.innerHTML=''; stream.setAttribute('d','');
  mission=null; stopWater(); hintEl=null; pointers.clear(); stopTrashMusic(1); gb=null;
  stage.classList.remove('dusk','night'); document.body.classList.remove('music','missionmode');
  tint.className='dark'; lullaby(); say(21);
  const gx=H>W?W*.6:W*.72, gTop=roadTop-roadH*.4;
  const g=document.createElement('div'); g.className='garage';
  Object.assign(g.style,{left:gx+'px',top:gTop+'px',width:(W-gx+10)+'px',height:(H-gTop)+'px'});
  g.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><pattern id="shut" width="4" height="6" patternUnits="userSpaceOnUse"><rect width="4" height="6" fill="#D7DEE8"/><rect y="5" width="4" height="1" fill="#AEB8C8"/></pattern></defs>
    <rect x="0" y="12" width="100" height="88" fill="#A3B1C6"/><rect x="-4" y="0" width="108" height="14" fill="#E63946"/>
    <rect x="8" y="30" width="84" height="70" fill="#1F2433"/><rect class="shutter" x="8" y="30" width="84" height="70" fill="url(#shut)"/></svg>`;
  mLayer.appendChild(g);
  P={gx, shutter:g.querySelector('.shutter'), queue:['ambulance','fire','bus','police','garbage'], timer:.6, list:[], closing:false};
}
function windUpdate(dt){
  if(timeState!=='winding'||!P) return;
  P.timer-=dt;
  if(P.timer<=0 && P.queue.length){ const v=makeVehicle(P.queue.shift(),1,1); v.dir=1; v.x=-v.w/2; v.speed=W*.28; v.el.classList.add('driving'); place(v); P.list.push(v); P.timer=1.7; }
  P.list=P.list.filter(v=>{ v.x+=v.speed*dt; place(v);
    if(!v.honked && v.x+v.w/2>P.gx){ v.honked=true; softHonk(); }
    const gone=v.x-v.w/2>W; if(gone) v.el.remove(); return !gone; });
  if(!P.queue.length && !P.list.length && !P.closing){
    P.closing=true; say(22);
    setTimeout(()=>{ if(P) P.shutter.classList.add('down'); },300);
    setTimeout(thud,1500);
    setTimeout(()=>{ if(timeState!=='winding') return; timeState='night'; nightEl.classList.add('show'); say(23); },2800);
  }
}
function restartTime(){
  playMs=0; timeState='play'; P=null; busy=false; tint.className=''; nightEl.classList.remove('show');
  layer.innerHTML=''; mLayer.innerHTML='';
  if(ctx&&lullGain){ const g=lullGain, t=ctx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(.0001,t+.5); setTimeout(()=>g.disconnect(),700); lullGain=null; }
  vehicles=[]; applyMode();
}

/* 特效 */
const PALETTE=['#FF5D73','#FFC43D','#06D6A0','#3A86FF','#B388FF','#FF9F1C'];
function burst(x,y){
  for(let i=0;i<8;i++){ const d=document.createElement('div'), a=i/8*Math.PI*2, r=50+Math.random()*30;
    d.className='dot'; d.style.left=x+'px'; d.style.top=y+'px'; d.style.background=PALETTE[i%6];
    d.style.setProperty('--dx',Math.cos(a)*r+'px'); d.style.setProperty('--dy',Math.sin(a)*r+'px');
    fx.appendChild(d); setTimeout(()=>d.remove(),750); }
}
function floatNote(x,y,c){
  const d=document.createElement('div'); d.className='note'; d.style.left=x+'px'; d.style.top=(y-50)+'px';
  d.style.setProperty('--r',(Math.random()*40-20)+'deg');
  d.innerHTML=`<svg viewBox="0 0 40 50"><ellipse cx="13" cy="39" rx="11" ry="8" fill="${c}" stroke="#fff" stroke-width="2"/><rect x="21" y="6" width="5" height="34" fill="${c}"/><path d="M26 6 Q39 10 36 25 Q32 16 26 16Z" fill="${c}"/></svg>`;
  fx.appendChild(d); setTimeout(()=>d.remove(),1250);
}
function confetti(){
  for(let i=0;i<46;i++){ const d=document.createElement('div'); d.className='conf';
    d.style.left=Math.random()*100+'%'; d.style.background=PALETTE[i%6];
    d.style.setProperty('--t',(1.6+Math.random()*1.4)+'s'); d.style.setProperty('--dx',(Math.random()*120-60)+'px');
    d.style.animationDelay=Math.random()*.5+'s'; fx.appendChild(d); setTimeout(()=>d.remove(),3600); }
}

/* 主迴圈 */
function loop(now){
  const dt=last?Math.min((now-last)/1000,.05):0; last=now;
  timeTick(dt);
  if(ending()){ windUpdate(dt); requestAnimationFrame(loop); return; }
  if(settings.mode==='tap'){
    vehicles=vehicles.filter(v=>{
      if(v.delay>0){ v.delay-=dt; v.el.classList.remove('driving'); }
      else{ v.x+=v.dir*v.speed*dt; v.el.classList.add('driving'); place(v); }
      const gone=v.x-v.w/2>W+20 || v.x+v.w/2<-20; if(gone) v.el.remove(); return !gone;
    });
    if(started && now-lastTouch>7000 && vehicles.length===0) spawnIdle();
  } else if(settings.mode==='trash'){
    trashUpdate(now,dt);
  } else if(settings.mode==='mission'){
    vehicles.forEach(v=>{ if(v.go){ v.x+=v.speed*dt; place(v); } });
    if(mission && mission.kind==='fire' && !busy && pointers.size){
      const lp=[...pointers.values()].pop(), n=mission.nozzle;
      const qx=(n.x+lp.x)/2, qy=Math.min(n.y,lp.y)-Math.max(60,Math.abs(lp.x-n.x)*.25);
      stream.setAttribute('d',`M${n.x} ${n.y} Q${qx} ${qy} ${lp.x} ${lp.y}`);
      pointers.forEach(p=>hitTargets(p.x,p.y,dt*1.1));
      if(Math.random()<.5) splash(lp.x,lp.y);
    } else if(stream.getAttribute('d')) stream.setAttribute('d','');
    if(started && !busy && !hintEl && now-lastTouch>3000) showHint();
  } else if(started && !busy && now-lastTouch>7000){
    const v=vehicles[Math.floor(Math.random()*vehicles.length)]; if(v) anim(v,'wiggle'); lastTouch=now-4000;
  }
  requestAnimationFrame(loop);
}

/* 觸控 */
function onTap(e){
  e.preventDefault();
  const r=stage.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(started && ending()) return;
  if(!started){ initAudio(); started=true; document.getElementById('start').style.display='none'; SOUNDS.bus(ctx.currentTime+.1); lastTouch=performance.now(); setTimeout(checkSound,1200); return; }
  initAudio(); lastTouch=performance.now(); clearHint();
  if(settings.mode==='mission'){ missionDown(e.pointerId,px,py); return; }
  if(settings.mode==='trash'){ trashTap(px,py); return; }
  const hit=vehicles.slice().sort((a,b)=>b.lane-a.lane).find(v=>Math.abs(px-v.x)<v.w*.48 && py>v.bottom-v.h*.95 && py<v.bottom);
  burst(px,py);
  if(settings.mode==='tap'){
    if(hit){ anim(hit,'hop'); playVehicle(hit.type); }
    else spawnAt(px,py);
  } else if(!busy) musicTap(px,py,hit);
}
stage.addEventListener('pointerdown',onTap);
stage.addEventListener('pointermove',e=>{ if(settings.mode!=='mission'||!started) return; const r=stage.getBoundingClientRect(); lastTouch=performance.now(); missionMove(e.pointerId,e.clientX-r.left,e.clientY-r.top); });
['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,e=>missionUp(e.pointerId)));
['touchend','click','pointerup'].forEach(ev=>document.addEventListener(ev,()=>{ if(started) unlock(); },{capture:true,passive:true}));
const warn=document.getElementById('sndwarn');
warn.addEventListener('pointerdown',e=>e.stopPropagation());
warn.addEventListener('click',()=>{ unlock(); setTimeout(()=>{ if(ctx) INST.xylo(freq('C5'),ctx.currentTime+.02); checkSound(); },150); });
['touchmove','gesturestart','gesturechange','dblclick','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>{ if(!e.target.closest('.card')) e.preventDefault(); },{passive:false}));

/* 家長設定：長按齒輪 */
const gear=document.getElementById('gear'), panel=document.getElementById('panel');
let holdT=null, holdStart=0;
function holdTick(){ const p=Math.min(1,(performance.now()-holdStart)/1000); gear.style.setProperty('--p',p*100+'%');
  if(p>=1){ cancelHold(); openPanel(); } else holdT=requestAnimationFrame(holdTick); }
function cancelHold(){ cancelAnimationFrame(holdT); holdT=null; gear.style.setProperty('--p','0%'); }
gear.addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); holdStart=performance.now(); holdTick(); });
['pointerup','pointerleave','pointercancel'].forEach(ev=>gear.addEventListener(ev,cancelHold));
panel.addEventListener('pointerdown',e=>e.stopPropagation());

const songsBox=panel.querySelector('.songs');
SONGS.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=s.name; b.dataset.v=i; songsBox.appendChild(b); });
function refreshPanel(){
  panel.querySelectorAll('[data-key="mode"] button').forEach(b=>b.classList.toggle('on',b.dataset.v===settings.mode));
  panel.querySelectorAll('[data-key="vol"] button').forEach(b=>b.classList.toggle('on',b.dataset.v===settings.vol));
  songsBox.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===settings.song));
  panel.querySelectorAll('[data-key="limit"] button').forEach(b=>b.classList.toggle('on',b.dataset.v===settings.limit));
  const m=Math.floor(playMs/60000), sec=Math.floor(playMs/1000)%60;
  panel.querySelector('.timeinfo').textContent = `已經玩了 ${m} 分 ${sec} 秒` + (ending()?'（已經說晚安了）':timeState==='warn'?'（提醒中，30 秒後收尾）':'');
  ['trashN','bagN'].forEach(k=>panel.querySelectorAll(`[data-key="${k}"] button`).forEach(b=>b.classList.toggle('on',b.dataset.v===settings[k])));
}
function openPanel(){ refreshPanel(); panel.classList.add('open'); }
panel.querySelector('[data-key="mode"]').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; settings.mode=b.dataset.v; save(); refreshPanel(); applyMode(); });
panel.querySelector('[data-key="vol"]').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; settings.vol=b.dataset.v; save(); refreshPanel(); if(master) master.gain.value=+settings.vol; });
songsBox.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; settings.song=+b.dataset.v; noteIdx=0; save(); refreshPanel(); updateProgress(); });
panel.querySelector('.test').addEventListener('click',()=>{ unlock(); setTimeout(()=>{ if(ctx){ const t=ctx.currentTime+.02; ['C5','E5','G5'].forEach((n,i)=>INST.xylo(freq(n),t+i*.15)); } checkSound(); },150); });
['trashN','bagN'].forEach(k=>panel.querySelector(`[data-key="${k}"]`).addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  settings[k]=b.dataset.v; save(); refreshPanel(); if(settings.mode==='trash') applyMode(); }));
panel.querySelector('[data-key="limit"]').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  settings.limit=b.dataset.v; save();
  if(timeState==='warn' && (settings.limit==='0' || playMs<+settings.limit*60000)){ timeState='play'; tint.className=''; }
  refreshPanel(); });
panel.querySelector('.again').addEventListener('click',()=>{ panel.classList.remove('open'); restartTime(); });
panel.querySelector('.close').addEventListener('click',()=>panel.classList.remove('open'));
panel.addEventListener('click',e=>{ if(e.target===panel) panel.classList.remove('open'); });

function applyMode(){
  if(ending()) return;
  document.body.classList.toggle('music',settings.mode==='music');
  document.body.classList.toggle('missionmode',settings.mode==='mission');
  noteIdx=0; busy=false; clearVehicles(); mLayer.innerHTML=''; stream.setAttribute('d',''); mission=null; stopWater(); clearHint(); pointers.clear();
  sceneLayer.innerHTML=''; stage.classList.remove('dusk','night'); stopTrashMusic(0); gb=null;
  if(settings.mode==='music') arrangeMusic();
  else if(settings.mode==='mission') startMission();
  else if(settings.mode==='trash') startTrash();
}
document.addEventListener('visibilitychange',()=>{ if(!ctx) return; document.hidden?ctx.suspend():ctx.resume(); });
let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ measure(); if(!ending()) applyMode(); },150); });

measure(); applyMode(); requestAnimationFrame(loop);
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
</script>
